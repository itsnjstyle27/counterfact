[project]
name = "counterfact"
version = "0.1.0"
description = "Off-policy evaluation estimators implemented from scratch and benchmarked on the Open Bandit Dataset."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "torch>=2.4",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"counterfact.resources" = ["*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "C4", "NPY"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["counterfact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["slow: trains reward models or runs many Monte Carlo replications"]
